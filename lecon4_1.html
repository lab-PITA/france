<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>フランス語 タイピング活用ドリル</title>
    <style>
        :root { --primary: #007bff; --wrong: #dc3545; --unknown: #6c757d; --bg: #f4f7f9; }
        
        body { font-family: -apple-system, sans-serif; background-color: var(--bg); margin: 0; display: grid; place-items: center; height: 100vh; overflow: hidden; }

        .app-container { width: 430px; height: 100%; background: white; position: relative; box-shadow: 0 0 10px rgba(0,0,0,0.1); display: grid; grid-template-rows: 60px 1fr; }
        @media (max-width: 430px) { .app-container { width: 100vw; } }

        header { border-bottom: 2px solid #eee; line-height: 60px; text-align: center; font-weight: bold; position: relative; }

        .screen { display: none; padding: 20px; box-sizing: border-box; overflow: hidden; height: 100%; }
        .screen.active { display: block; }

        .question-box {
            display: grid;
            grid-template-rows: auto auto auto; 
            height: 100%;
            align-content: start;
            gap: 10px;
            box-sizing: border-box;
        }

        .top-content {
            min-height: 140px;
            display: grid;
            align-items: center;
        }

        .sentence-display {
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            line-height: 1.6;
        }

        .blank-line { display: inline-block; width: 100px; border-bottom: 3px solid var(--primary); margin: 0 5px; vertical-align: text-bottom; color: var(--primary); }

        #input-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            margin-top: 30px;
        }

        .text-input {
            width: 100%;
            height: 60px;
            font-size: 1.5rem;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: 12px;
            box-sizing: border-box;
            background-color: #fafafa;
            /* スマホの自動変換を防ぐ */
            appearance: none;
        }
        .text-input:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #fff;
        }

        .btn-submit { width: 100%; height: 60px; font-size: 1.2rem; font-weight: bold; border-radius: 12px; border: none; background: var(--primary); color: white; cursor: pointer; }
        .btn-submit:active { background: #0056b3; }
        
        .btn-u { width: 100%; height: 50px; background: #f0f0f0; border: none; border-radius: 10px; color: #666; font-size: 1rem; cursor: pointer; margin-top: 5px; }

        .start-btn { width: 100%; height: 60px; background: var(--primary); color: white; border: none; border-radius: 15px; font-size: 1.2rem; font-weight: bold; cursor: pointer; margin-top: 15px; margin-bottom: 15px; }
        .btn-portal { display: block; width: 100%; height: 60px; background: #eee; color: #333; border-radius: 15px; text-decoration: none; text-align: center; line-height: 60px; font-weight: bold; margin-top: 10px; margin-bottom: 15px; }

        .result-area { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }
        .result-scroll { overflow-y: auto; }
        .res-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
        .res-table td, .res-table th { padding: 12px 4px; border-bottom: 1px solid #eee; text-align: center; }
        .res-o { color: var(--primary); }
        .res-x { color: var(--wrong); font-weight: bold; background: #fff5f5; }
        .res-u { color: var(--unknown); background: #f1f3f5; }

        #feedback { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 10rem; z-index: 150; display: none; pointer-events: none; opacity: 0.8; }
    </style>
</head>

<div class="app-container">
    <header>タイピング活用ドリル</header>

    <div id="setup-screen" class="screen active">
        <h2 style="text-align:center; margin-top:40px;">キーボード入力テスト</h2>
        <p style="text-align:center; font-size:0.9rem; color:#666;">
            特殊な変化をする名詞・形容詞・非er動詞を<br>中心に、自力でスペルを入力する特訓です。
        </p>
        <div style="margin-top:30px;">
            <label style="font-weight:bold; color:#666;">出題数を選択</label>
            <select id="count-select" style="width:100%; padding:15px; margin-top:10px; border-radius:10px; font-size:1rem;">
                <option value="5" selected>5問</option>
                <option value="10">10問</option>
                <option value="15">15問</option>
            </select>
        </div>
        <button class="start-btn" onclick="initQuiz()">学習開始</button>
        <a href="index.html" class="btn-portal">ポータルに戻る</a>
    </div>

    <div id="screen-quiz" class="screen">
        <div class="question-box">
            <div id="progress" style="text-align:right; color:#999; font-size:0.8rem;"></div>
            
            <div class="top-content">
                <div id="display-q" class="sentence-display"></div>
            </div>
            
            <div id="input-container">
                <input type="text" id="answer-input" class="text-input" 
                       placeholder="ここに入力..." 
                       autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
                
                <button class="btn-submit" onclick="submitAnswer()">回答する</button>
                <button class="btn-u" onclick="handleAnswer('u')">わからない</button>
            </div>
        </div>
    </div>

    <div id="result-screen" class="screen">
        <div class="result-area">
            <h2>結果発表</h2>
            <div class="result-scroll">
                <table class="res-table">
                    <thead><tr><th style="width:15%">結</th><th>文章</th><th style="width:25%">あなたの答</th><th style="width:25%">正解</th></tr></thead>
                    <tbody id="result-body"></tbody>
                </table>
            </div>
            <button class="start-btn" onclick="location.reload()">トップに戻る</button>
        </div>
    </div>

    <div id="feedback"></div>
</div>

    let quizSet = []; 
    let currentIndex = 0; 
    let userResults = [];
    const inputField = document.getElementById('answer-input');

    // Enterキーを押したときの処理
    inputField.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault(); 
            inputField.blur(); // 判定はせず、フォーカスを外してキーボードを隠す
        }
    });

    function initQuiz() {
        const countVal = parseInt(document.getElementById('count-select').value);
        
        // 特殊プール(80%) と erプール(20%) に分ける
        let specialPool = database.filter(d => d.type === 'special').sort(() => Math.random() - 0.5);
        let erPool = database.filter(d => d.type === 'er').sort(() => Math.random() - 0.5);
        
        let erCount = Math.floor(countVal * 0.2); // er動詞は全体の20%
        let specialCount = countVal - erCount;    // 残りの80%を特殊変化問題に
        
        quizSet = [
            ...specialPool.slice(0, specialCount),
            ...erPool.slice(0, erCount)
        ].sort(() => Math.random() - 0.5); // 最後に混ざるように全体をシャッフル
        
        currentIndex = 0; userResults = [];
        showScreen('screen-quiz');
        renderQuestion();
    }

    function renderQuestion() {
        const q = quizSet[currentIndex];
        document.getElementById('progress').innerText = `${currentIndex + 1} / ${quizSet.length}`;
        document.getElementById('display-q').innerHTML = q.q + `<div style="font-size:1.1rem; color:#666; font-weight:normal; margin-top:15px;">${q.tr}</div>`;
        
        inputField.value = '';
        inputField.focus(); 
    }

    function submitAnswer() {
        const userInput = inputField.value.trim().toLowerCase();
        if (userInput === '') return;
        handleAnswer(userInput);
    }

    function handleAnswer(ans) {
        inputField.blur(); // キーボードを引っ込める

        const q = quizSet[currentIndex];
        const isCorrect = (ans === q.a.toLowerCase());
        const status = ans === 'u' ? 'u' : (isCorrect ? 'o' : 'x');
        
        userResults.push({...q, userAns: ans, status});

        const fb = document.getElementById('feedback');
        fb.innerText = status === 'o' ? '〇' : (status === 'x' ? '×' : '？');
        fb.style.color = status === 'o' ? 'var(--primary)' : (status === 'x' ? 'var(--wrong)' : 'var(--unknown)');
        fb.style.display = 'block';

        setTimeout(() => {
            fb.style.display = 'none'<button class="btn-submit" onclick="submitAnswer()">回答する (Enter)</butto
            currentIndex++;
            if(currentIndex < quizSet.length) {
                renderQuestion();
            } else {
                showFinalResult();
            }
        }, 800); 
    }

    function showFinalResult() {
        showScreen('result-screen');
        const body = document.getElementById('result-body');
        body.innerHTML = '';

        const order = { u: 1, x: 2, o: 3 };
        userResults.sort((a, b) => order[a.status] - order[b.status]);

        userResults.forEach(r => {
            const tr = document.createElement('tr');
            tr.className = `res-${r.status}`;
            const displayAns = r.userAns === 'u' ? '？' : r.userAns;
            tr.innerHTML = `<td>${r.status==='o'?'〇':(r.status==='x'?'×':'？')}</td>
                            <td style="text-align:left">${r.q.replace("<span class='blank-line'></span>", "<b>"+r.a+"</b>")}</td>
                            <td>${displayAns}</td>
                            <td>${r.a}</td>`;
            body.appendChild(tr);
        });
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
</script>
